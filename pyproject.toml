[project]
name = "app-store-connect-mcp"
version = "0.1.0"
description = "MCP server para puxar dados de analytics e relatorios do App Store Connect (Analytics Reports API + Sales and Trends + Finance)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=2.0.0,<4",
    "pyjwt[crypto]>=2.8.0,<3",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-requests",
]

[project.scripts]
app-store-connect-mcp = "app_store_connect_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app_store_connect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: hits the real App Store Connect API; needs credentials (run with -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
